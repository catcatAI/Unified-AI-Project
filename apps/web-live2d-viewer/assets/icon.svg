<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="tokenBg256" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#263447" />
      <stop offset="70%" stop-color="#1A222F" />
      <stop offset="100%" stop-color="#10151E" />
    </radialGradient>

    <linearGradient id="goldWing256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8" />
      <stop offset="45%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#B88E36" />
    </linearGradient>

    <linearGradient id="goldStar256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7D6" />
      <stop offset="50%" stop-color="#C9A44C" />
      <stop offset="100%" stop-color="#9A7828" />
    </linearGradient>

    <filter id="goldGlow256" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Token Base -->
  <circle cx="128" cy="128" r="120" fill="url(#tokenBg256)" stroke="#E88DB8" stroke-width="6" />

  <!-- Outer Orbital Rose & Teal Aura -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="#E88DB8" stroke-width="3" opacity="0.6" />
  <circle cx="128" cy="128" r="98" fill="none" stroke="#4D9A91" stroke-width="2.5" stroke-dasharray="8 10" opacity="0.8" />

  <!-- Left-sweeping Angel Wing (左鬢羽翼飾) -->
  <g filter="url(#goldGlow256)">
    <!-- Base Lower Feather -->
    <path d="M 132 136 C 108 136 80 148 56 156 C 80 140 100 128 124 124 Z" fill="#9C7426" opacity="0.9" />

    <!-- Secondary Mid Feather -->
    <path d="M 128 120 C 92 108 60 112 44 112 C 68 100 96 96 132 108 Z" fill="url(#goldWing256)" />

    <!-- Main Upper Flight Feather -->
    <path d="M 136 104 C 104 76 72 68 48 64 C 76 72 104 84 140 96 Z" fill="url(#goldWing256)" />

    <!-- Wing Arc Shimmer / Highlight -->
    <path d="M 136 100 C 108 80 80 72 60 70 C 80 76 104 86 132 98 Z" fill="#FFFBE6" opacity="0.85" />
  </g>

  <!-- 4-point Radiant Gold Star (左鬢金星) -->
  <g filter="url(#goldGlow256)">
    <!-- Diagonal Subtle 4-Ray Sparkle -->
    <path d="M 140 128 L 124 112 L 140 128 L 156 112 Z" fill="#FFEAA8" opacity="0.45" />
    <path d="M 140 128 L 156 144 L 140 128 L 124 144 Z" fill="#FFEAA8" opacity="0.45" />

    <!-- Primary 4-Point Star Facets -->
    <!-- Top Ray -->
    <polygon points="140,64 146,118 140,128 134,118" fill="#FFF0B3" />
    <!-- Bottom Ray -->
    <polygon points="140,192 134,138 140,128 146,138" fill="#C9A44C" />
    <!-- Right Ray -->
    <polygon points="204,128 150,134 140,128 150,122" fill="#E5C158" />
    <!-- Left Ray (connecting to wing base) -->
    <polygon points="76,128 130,122 140,128 130,134" fill="#A88230" />

    <!-- Central Brilliant Ivory Sparkle (#FFF8F0) -->
    <circle cx="140" cy="128" r="9.6" fill="#FFF8F0" />
    <circle cx="140" cy="128" r="4.8" fill="#FFFFFF" />

    <!-- Center Glint (Teal Micro-accent) -->
    <polygon points="140,112 143.2,128 140,144 136.8,128" fill="#4D9A91" opacity="0.75" />
  </g>
</svg>
