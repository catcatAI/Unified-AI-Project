# 帶條件與例外的斷言庫（ai.reasoning.claims 的知識資產）
#
# 每條斷言要能同時給出：事實（連同條件）、例外、以及一個「完全不符合」的
# 例子。答案的形式是「在<條件>下<事實>；但<例外>」——這是「最正確」與
# 「近似正確」的差別。
#
# **與量測的關係**：這裡的主題刻意不與標準集（ai/response/human_speech.py 的
# state 類）重疊——標準集那 324 題量的是**知識缺口**（沒被教過就答不出來，
# 誠實棄權是正確行為），這裡的斷言加上 `claim_holdout` 題目量的是**機制**
# （斷言庫有的東西能不能帶著條件與例外答出來）。

claims:
  - id: alcohol_boiling
    statement: "酒精的沸點約 78°C"
    condition: "在標準大氣壓下"
    exception: "高海拔低氣壓時會更低，加入鹽類則會升高"
    irrelevant: "這杯酒的溫度是 78°C"
    # 「沸點」太泛（水的沸點也會命中），只留專屬詞。
    keywords: ["酒精", "乙醇", "酒精沸點", "酒沸點", "酒精的沸點"]

  - id: blood_alcohol_limit
    statement: "一般駕駛的血液酒精濃度上限是 0.15%"
    condition: "在一般道路駕駛汽車時"
    exception: "機車與大客車是 0.03%，喝到 0.03% 以上就屬嚴重違規"
    irrelevant: "這杯飲料的酒精濃度是 0.15%"
    keywords: ["酒精濃度", "酒測", "酒駕", "血液酒精"]

  - id: infant_jaundice
    statement: "新生兒黃疸的指數在出生後第 3 到 5 天最高"
    condition: "以足月嬰兒的一般情況來看"
    exception: "早產兒的高峰較晚，未照光治療時消退也較慢"
    irrelevant: "這張黃疸照片的顏色比較深"
    keywords: ["黃疸", "新生兒黃疸", "膽紅素"]

  - id: milk_shelf_life
    statement: "鮮奶的冷藏保存期限通常是 7 到 10 天"
    condition: "以未開封、全程 4°C 以下冷藏來看"
    exception: "開封後大約 3 到 5 天，室溫放太久會提早變質"
    irrelevant: "這盒牛奶是 200 毫升"
    keywords: ["牛奶", "鮮奶", "奶保存", "牛奶期限"]

  - id: sunscreen_shelf_life
    statement: "防曬乳的效期是三年"
    condition: "以未開封、正規販售的產品來看"
    exception: "開封後建議一年內用完， 高溫存放會加速劣化"
    irrelevant: "這條防曬乳是 100 毫升"
    keywords: ["防曬", "防曬乳", "防晒", "效期"]

  - id: planets_count
    statement: "太陽系有八顆行星"
    condition: "以 2006 年國際天文聯合會的行星定義來看"
    exception: "冥王星因為無法清除軌道附近的小天體而被降級為矮行星"
    irrelevant: "這張照片是銀河系"
    keywords: ["行星", "太陽系", "幾顆行星"]

  - id: ocean_surface
    statement: "地球表面約有 71% 被水覆蓋"
    condition: "以整個地球表面積的平均值來算"
    exception: "不同測量方式會讓數字有幾個百分點的差異"
    irrelevant: "這杯水有 300 毫升"
    keywords: ["地球表面", "海洋覆蓋", "水覆蓋", "71%"]

  - id: water_hardness_boiling
