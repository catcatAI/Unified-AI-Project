# State Matrix Meta-Configuration
# Defines axes, initial values, and weights
#
# 定義稽核 (2026-10-14): 本檔目前未被 get_formula_config("matrix") 載入
# （app_config_loader._CONFIG["formula"] 無 "matrix" key），運行時走
# state_matrix.py 的 DEFAULT_DIMENSIONS。為避免雙源分歧，本檔的
# initial_values / cn_name 已與 DEFAULT_DIMENSIONS 完全對齊（live 為準）；
# weight / initial_coordinate / anchor_keywords 為未啟用的設計草稿值，
# 接線前需人工定奪（改變 weight 即改變 compute_influences 輸出）。
# 對齊後接線本檔＝行為不變。見 docs/06-project-management/fixes/DEFINITIONS_AUDIT_2026-10-14.md

