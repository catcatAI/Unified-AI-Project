# State Matrix Meta-Configuration
# Defines axes, initial values, and weights
#
# 定義稽核 (2026-10-14): 本檔經 app_config_loader 載入為 _CONFIG["formula"]["matrix"]，
# state_matrix.py __init__ 讀取 dimensions 初始化（get_formula_config("matrix")）。
# initial_values / cn_name 與 live 行為對齊（單一源）。weight / initial_coordinate
# 一律取 live 預設（1.0 / [0,0,0]），anchor_keywords 不設（live 無錨點載入）——
# 接線本檔＝行為不變。見 docs/06-project-management/fixes/DEFINITIONS_AUDIT_2026-10-14.md

dimensions:
  alpha:
    cn_name: "生理"
    initial_values:
      { energy: 0.5, comfort: 0.5, arousal: 0.5, rest_need: 0.5, vitality: 0.5, tension: 0.0 }
    weight: 1.0
    initial_coordinate: [0.0, 0.0, 0.0]

  beta:
