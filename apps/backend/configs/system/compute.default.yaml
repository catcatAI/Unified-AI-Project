# =============================================================================
# GPU/CPU Compute Configuration
# Controls hardware acceleration for compute-intensive AI features.
# =============================================================================
# ANGELA-MATRIX: [L2] [β] [C] [L1]
# =============================================================================
#
# Each feature has a "mode" that can be:
#   - "auto"  : Detect hardware and use GPU if available, fallback to CPU
#   - "on"    : Force GPU (will error if GPU unavailable)
#   - "off"   : Force CPU-only (disables GPU acceleration)
#
# Features that can run on CPU (pure NumPy fallback available):
#   - ed3n_snn        : ED3N Spiking Neural Network
#   - garden_snn      : GARDEN TensorSNNCore
#   - three_layer_visual : ThreeLayerVisual decoder training
#   - semantic_visual : CLIP-based visual encoder
#   - semantic_audio  : Whisper-based audio encoder
#   - multimodal_train: FullTrainingPipeline (contrastive + reconstruction)
#   - vector_store    : ChromaDB persistence (GPU only for embeddings)
#
# Features that REQUIRE GPU (no CPU fallback):
#   - gpu_accelerator   : GPUAcceleratorService (WebGL compute shaders)
#   - llm_local_gpu     : llama.cpp / ollama with GPU offload
#
# Hardware detection uses hardware_profile.py which auto-detects:
#   - HIGH_PERFORMANCE_DESKTOP (GPU available)
#   - LAPTOP_NORMAL (GPU may be available)
#   - LAPTOP_POWER_SAVER (prefer CPU)
#   - LOW_POWER_DEVICE (force CPU)
#   - SERVER_CLOUD (GPU typically available)

compute:
  # Global GPU/CPU strategy
  global:
    mode: "auto"                    # auto | on | off
    force_cpu_on_low_power: true    # Switch to CPU when LAPTOP_POWER_SAVER/LOW_POWER_DEVICE
    log_fallback: true              # Log when falling back from GPU to CPU

  # ED3N Spiking Neural Network
  ed3n_snn:
    mode: "auto"
    batch_size_multiplier: 1.0      # Scale batch size for GPU memory
    timestep_parallel: false        # Parallelize timesteps (GPU only)

  # GARDEN TensorSNNCore — vocab matrix is V²×4B (10k→0.38GB, 20k→1.5GB,
  # 51k→10GB). Default 10k is the lean conservative target (fits 8GB boxes);
  # 51k is the extended 10GB target (needs 16GB+ and ANGELA_EXTENDED_MODEL=1).
  # The joint memory/% capacity cascade clamps any ceiling to RAM:
  # effective = min(ceiling, sqrt(usable_GB*1024³*max_percent/4)).
  garden_snn:
    mode: "auto"
    max_vocab: 10000                # lean default 0.38GB; 51812 for extended 10GB
    connection_budget: 50000        # lean default; 500k/1M for extended

  # NeuralBridge — StateMatrix ↔ GARDEN/ED3N SNN direct numeric connection.
  # When "on", state axis values are injected into the SNN as input
  # activations and SNN outputs are written back to the state matrix,
  # bypassing the LLM text-based transfer.
  neural_bridge:
    mode: "off"                     # off | auto | on

  # ThreeLayerVisual decoder training
  three_layer_visual:
    mode: "auto"
    training_batch_size: 32
    use_mixed_precision: true       # FP16 on GPU
    pca_components: 64

  # Semantic Visual Encoder (CLIP)
  semantic_visual:
    mode: "auto"
    model_name: "openai/clip-vit-base-patch32"
    batch_size: 16
    use_flash_attention: false

  # Semantic Audio Encoder (Whisper)
  semantic_audio:
    mode: "auto"
    model_name: "openai/whisper-base"
    batch_size: 8

  # Multimodal Full Training Pipeline
  multimodal_train:
    mode: "auto"
    contrastive_epochs: 10
    recon_epochs: 10
    batch_size: 20

  # Vector Store (ChromaDB embeddings)
  vector_store:
    mode: "auto"
    use_gpu_index: false            # GPU index only if >100k vectors

  # GPU Accelerator Service (WebGL - requires GPU)
  gpu_accelerator:
    mode: "off"                     # Default off - requires WebGL context
    webgl_version: 2
    fallback_cpu: true

  # Local LLM GPU offload (llama.cpp / ollama)
  llm_local_gpu:
    mode: "auto"
    gpu_layers: -1                  # -1 = all layers on GPU
    main_gpu: 0

  # Unified Engine — fixed-size statistical core (text)
  # slots: hash table size (power of two). 65k saturates at ~100MB text
  # (+127MB per doubling to 128k gives -5.6% bpc measured on wiki_en).
  # use_feat: allocate Q=A feature tables (65.5MB). Pure-text corpora never
  # fill them; set false to reclaim memory.
  unified:
    mode: "auto"
    slots: 65536                 # 65k default; 131072 for -5.6% bpc on 8GB+
    use_feat: true              # set false to save 65.5MB on pure-text
    use_delta: true

  # Game (apps/game-rpg) integration
  # Controls whether the CLI game mounts its free-matrix / card dictionary /
  # axis registry into the backbone. Pure-IO, no heavy compute — kept "on".
  game:
    mode: "on"
    mount_card_dictionary: true
    mount_free_matrix: true
    mount_axes: true
    max_cards: 351

  # Per-hardware-profile overrides (merged with global)
  # These are applied based on hardware_profile.py detection
  profiles:
    high_performance_desktop:
      global:
        mode: "auto"
      ed3n_snn:
        batch_size_multiplier: 2.0
      garden_snn:
        max_vocab: 51812
        connection_budget: 500000
      three_layer_visual:
        training_batch_size: 64
      semantic_visual:
        batch_size: 32
      semantic_audio:
        batch_size: 16
      unified:
        slots: 65536              # keep 65k default; set 131072 to trade +127MB for -5.6% bpc

    laptop_normal:
      global:
        mode: "auto"
      ed3n_snn:
        batch_size_multiplier: 1.0
      garden_snn:
        max_vocab: 10000
        connection_budget: 50000

    desktop_igpu:
      global:
        mode: "auto"
      ed3n_snn:
        batch_size_multiplier: 1.0
      garden_snn:
        max_vocab: 10000
        connection_budget: 50000
      three_layer_visual:
        training_batch_size: 32
      semantic_visual:
        batch_size: 16
      semantic_audio:
        batch_size: 8

    laptop_power_saver:
      global:
        mode: "off"
      ed3n_snn:
        mode: "off"
      garden_snn:
        mode: "off"
      three_layer_visual:
        mode: "off"
      semantic_visual:
        mode: "off"
      semantic_audio:
        mode: "off"
      multimodal_train:
        mode: "off"
      llm_local_gpu:
        mode: "off"

    low_power_device:
      global:
        mode: "off"
      unified:
        slots: 32768              # 32k saves ~96MB vs 65k (loss ~+3% bpc)
        use_feat: false           # saves extra 32MB feature table
      # All features forced to CPU/off

    server_cloud:
      global:
        mode: "auto"
      ed3n_snn:
        batch_size_multiplier: 4.0
      garden_snn:
        max_vocab: 51812
        connection_budget: 1000000
      three_layer_visual:
        training_batch_size: 128
      semantic_visual:
        batch_size: 32