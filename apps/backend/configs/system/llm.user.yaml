# User configuration overrides
# Add user-specific overrides below to customize Angela's behavior
# This file takes priority over *.default.yaml but below *.evolved.yaml
backends:
  # C2/#19: 本機 8080/8081 llama-server 目前未運行 — 保持 enabled 會讓每次
  # 啟動白付 3×5s health 探測（且後端必被 prune）。等離線策略（C1）定案、
  # 真的起了 server 再由 Desktop Settings 改回 enabled: true。
  llamacpp-local:
    enabled: false
    base_url: http://127.0.0.1:8080
    model_name: gemma-4-E2B-it
    context_window: 4096
    timeout: 120
  ollama-llama3:
    enabled: false
  llamacpp-qwen:
    enabled: false
    base_url: http://127.0.0.1:8081
    model_name: qwen2.5-0.5b-instruct
    context_window: 2048
    timeout: 120
settings:
  preferred_backend: llamacpp
deployment:
  mode: local+llm
