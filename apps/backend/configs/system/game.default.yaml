# =============================================================================
# Game Configuration (apps/game-rpg integration)
# Loaded via tiered_loader get_config("system/game").
# ANGELA-MATRIX: [L2] [β] [C] [L1]
# =============================================================================
#
# Two honoured keys only:
#   - enabled     : backbone_bridge gate (apps/game-rpg/backbone_bridge.py
#                   _game_config_enabled; missing config => False, conservative)
#   - data_path   : authoritative deck path, asserted equal to the dataset
#                   location by tests/core/backbone/test_c6_datasets.py
#
# History: seven aspirational keys (mount_card_dictionary / mount_free_matrix /
# mount_axes / max_cards / dictionary_modality / axis_registry_name /
# supplement_path) described a backbone-mount design that was never built.
# They were declared dead by tests/test_config_coverage.py (UNHONOURED_SECTIONS)
# and removed on 2026-10-17 — see
# docs/02-game-design/GAME_SUBSYSTEM_AUDIT_AND_AXIS_ENGINE_PLAN.md (P1-5).
# Reintroduce a key only together with a real consumer + its coverage-test drop.

game:
  enabled: true
  data_path: "apps/game-rpg/data/game_cards.json"
