# ANGELA-MATRIX: [L2] [β] [C] [L1]
# Timing parameters — centralized durations for P6-3 magic number migration
# Maintained by COMPREHENSIVE_AUDIT_REPORT.md P3.x — all keys must match code usage

timing:
  loop:
    sleep_short: 0.1
    sleep_medium: 0.5
    sleep_long: 1.0
    sleep_very_long: 10.0
    sleep_extreme: 60.0
    sleep_fps: 0.033
    sleep_circuit_breaker: 300.0
    # P3.1: added 2026-05-31 — used by waiting_scheduler.py, event_loop_system.py, error_handler.py, lifespan.py, live2d_integration.py
    poll_interval: 0.5
    metrics_interval: 1.0
    demo_wait: 0.5
    live2d_update: 0.033
    security_audit: 3600
    plugin_tick: 30
    retry_operation: 0.1
    backup_operation: 0.1
    max_wait: 30.0
    # 2026-10-13 §X #143 keys: code called loop_sleep(<name>) but the YAML
    # keys never existed, so every one of these silently used its inline
    # default and the "migrated to config" claim was unverifiable.
    agent_restart_delay: 5.0 # base_agent.py backoff base
    transport_retry: 1.0 # hsp/transport.py reconnect pause
    cloud_sync_upload: 0.1 # cloud_sync.py upload pacing
    cluster_task_distribute: 0.1 # cluster_manager.py dispatch pacing
    ws_broadcast_retry: 5.0 # websocket_manager.py failed-broadcast retry
    ws_broadcast_interval: 1.0 # websocket_manager.py broadcast cadence
    hsp_process_message: 0.1 # hsp/versioning.py synthetic processing pause
    fallback_retry_backoff: 0.2 # hsp/fallback manager pause between protocol rotations
    demo_action_delay: 0.3 # action_executor.py sample-action pause (demo path)

  retry:
    # 2026-10-13: same §X #143 gap — retry_value() keys with no YAML entry.
    agent_task_retries: 3 # base_agent.py task retry budget
    router_health_retries: 5 # agent_manager.py router probe retries

  timeout:
    short: 5.0
    medium: 10.0
    long: 30.0
    very_long: 60.0
    extreme: 120.0
    circuit_breaker_recovery: 300.0
    # P3.1: added 2026-05-31 — used by lifespan.py, waiting_scheduler.py, event_loop_system.py
    shutdown: 10.0
    queue_dequeue: 0.001
    llm: 60.0
    action_timeout: 30.0 # engine/action_executor.py autonomous action budget

  llm:
    default_temperature: 0.7
    default_max_tokens: 512
    math_temperature: 0.3
    math_max_tokens: 256
    project_temperature: 0.5
    project_max_tokens: 1024
    generate_timeout: 60.0
    # 2026-10-13: timeout_value("llm.<name>") call sites in services/llm/router.py
    # previously resolved to nothing (keys absent) — values below match the
    # inline defaults the code had been silently using.
    health_check: 5.0
    generate_text: 60.0
    neural_bridge: 30.0
    fallback_chain: 30.0

  heartbeat:
    max_interval: 60.0
    min_interval: 5.0
    base_rate: 30.0
    stress_divisor: 50.0
    stress_multiplier: 2
    low_battery_threshold: 20
    # P3.1: added 2026-05-31 — used by lifespan.py:get_metabolic_heartbeat()
    update_interval: 30.0

  vision:
    processing_fast: 0.02
    processing_medium: 0.05
    processing_slow: 0.1
    processing_ocr: 0.06
    processing_detect: 0.07
    processing_caption: 0.04
    processing_classify: 0.03
