name: 测试自动化流程
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1" # 每周一凌晨2点执行

jobs:
  test-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: 设置Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r "./apps/backend/requirements.txt"
          pip install -r "./apps/backend/requirements-dev.txt"

      - name: 运行集成测试
        run: |
          cd apps/backend
          python -m pytest tests/integration/ -v --cov=src --cov-report=xml

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v5
        with:
          file: ./apps/backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

      # 2026-10-15: 刪除「检查测试结果」死步驟（`$?` 檢查獨立 step 永遠
      # 看到 0——pytest 失敗早已由前一步令 job 紅燈，此步是偽保險）。
      # 亦刪除 test-quality-gate 假門（echo-only + if:always ⇒ 恆綠，
      # "覆盖率阈值检查通过" 純宣告）——要真門請加可失敗的覆蓋率腳本。

  notification:
    runs-on: ubuntu-latest
    needs: [test-suite]

    steps:
      - name: 发送通知
        if: failure()
        run: |
          echo "测试执行失败，请检查GitHub Actions日志"

      - name: 发送成功通知
        if: success()
        run: |
          echo "所有测试通过，质量检查完成"
