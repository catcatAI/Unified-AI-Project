name: CLI Tests

on:
  push:
    paths:
      - "packages/cli/**"
      - ".github/workflows/cli-tests.yml"
  pull_request:
    paths:
      - "packages/cli/**"

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CLI (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/cli
          pip install pytest
      - name: Run tests
        run: |
          # 2026-10-15: packages/cli 此前零測試檔 ⇒ pytest exit 5（no tests
          # collected）= 觸發即紅/形同虛設。補 packages/cli/tests/test_smoke.py
          # 後此門才有意義。
          pytest packages/cli -q
