name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: "pnpm"
      - name: Install JS workspaces
        run: pnpm install --frozen-lockfile=false
      - name: Lint (JS)
        run: pnpm lint:js
      - name: Type check (TS — web-dashboard 20 檔納入門禁)
        # Next 16 移除 next lint/next build 型別併入 build；此處獨立 tsc
        # --noEmit 把 web-dashboard 的 .ts/.tsx 顯式納入 CI，不再裸奔
        run: pnpm typecheck:dashboard
      - name: Prettier check (full repo, .prettierignore-gated)
        run: pnpm exec prettier --check .

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Version consistency check
        run: |
          EXPECTED="7.5.0-dev"
          ERR=0
          check() { local file=$1 expected=$2 actual=$(cat "$file" 2>/dev/null | grep -oP '"version":\s*"\K[^"]+' || true); if [ "$actual" != "$expected" ]; then echo "❌ $file: expected $expected, got $actual"; ERR=1; fi; }
          echo "Verifying all version locations match $EXPECTED..."
          grep -q "$EXPECTED" VERSION || { echo "❌ VERSION: expected $EXPECTED"; ERR=1; }
          grep -q "$EXPECTED" configs/angela_config.json || { echo "❌ configs/angela_config.json: not $EXPECTED"; ERR=1; }
          grep -q "version = \"$EXPECTED\"" apps/backend/pyproject.toml || { echo "❌ apps/backend/pyproject.toml: not $EXPECTED"; ERR=1; }
          # apps/backend/setup.py does not exist in this repo layout — skip
          grep -q "$EXPECTED" apps/backend/package.json || { echo "❌ apps/backend/package.json: not $EXPECTED"; ERR=1; }
          grep -q "major=7" apps/backend/src/core/version.py && grep -q "minor=5" apps/backend/src/core/version.py && grep -q "patch=0" apps/backend/src/core/version.py && grep -q "phase=ReleasePhase.DEV" apps/backend/src/core/version.py || { echo "❌ apps/backend/src/core/version.py: not major=7, minor=5, patch=0, phase=DEV"; ERR=1; }
          grep -q "$EXPECTED" apps/desktop-app/electron_app/package.json || { echo "❌ apps/desktop-app/electron_app/package.json: not $EXPECTED"; ERR=1; }
          grep -q "$EXPECTED" packages/cli/package.json || { echo "❌ packages/cli/package.json: not $EXPECTED"; ERR=1; }
          grep -q "VERSION: $EXPECTED" README.md || { echo "❌ README.md: expected $EXPECTED"; ERR=1; }
          grep -q "VERSION: $EXPECTED" AGENTS.md || { echo "❌ AGENTS.md: expected $EXPECTED"; ERR=1; }
          grep -q "version: \"$EXPECTED\"" configs/angela_config.yaml || { echo "❌ configs/angela_config.yaml: not $EXPECTED"; ERR=1; }
          grep -q "$EXPECTED" .github/workflows/ci.yml || { echo "❌ .github/workflows/ci.yml: self-check failed"; ERR=1; }
          if [ $ERR -eq 1 ]; then exit 1; else echo "✅ All version locations consistent ($EXPECTED)"; fi
      - name: Install backend (editable with extras)
        run: pip install -e "./apps/backend[dev]"
        env:
          ANGELA_HARDWARE_PROFILE: high_performance_desktop
      - name: Lint/Type (Python)
        run: |
          # 2026-10-20: apps/backend/tests/ was outside the lint scope — the
          # audit recorded it as a known blind spot ("56 E541 級既有 flake8
          # 告警…CI 的 lint 範圍不含 apps/backend/tests/"). The warnings are
          # fixed and the scope now covers the tree CI actually runs.
          black --check apps/backend/src apps/backend/tests tests/
          isort --check-only apps/backend/src apps/backend/tests tests/
          flake8 apps/backend/src apps/backend/tests tests/
          python scripts/mypy_budget_gate.py
          python scripts/complexity_budget_gate.py
          python scripts/type_ignore_budget_gate.py
        env:
          ANGELA_HARDWARE_PROFILE: high_performance_desktop
      - name: Fact gates (facts + definitions — 單一檢查入口)
        # AGENTS.md「單一檢查入口」：九域事實門 + 定義稽核一次跑完。
        # 掛進 CI 是為了「不打開就被掠過」——與 pre-commit fact-gates hook 同一入口。
        run: |
          python scripts/check_fact_gates.py
        env:
          ANGELA_HARDWARE_PROFILE: high_performance_desktop
      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r apps/backend/src -ll -c pyproject.toml
      - name: Security scan (pip-audit)
        run: |
          # safety's `check` command was removed upstream (exit 64) and its
          # replacement `scan` requires interactive login, so it can never pass
          # unattended. pip-audit is the maintained, auth-free equivalent.
          pip install -U setuptools pip-audit
          # The --ignore-vuln list is packages with NO upstream fix yet
          # (chromadb/diskcache/nltk); CI still fails on any NEW vulnerability.
          pip-audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln PYSEC-2026-2447 \
            --ignore-vuln PYSEC-2026-3740
      - name: Tests (Python)
        # 2026-10-15: 承接 AGENTS 標準範圍（tests/ + apps/backend/tests/ +
        # apps/game-rpg/tests/）。此前 CI 只跑 tests/，backend/game 兩棵
        # 測試樹在 CI 上永不執行（隱藏範圍）；backend 另缺獨立 path
        # bootstrap（apps/backend/tests/conftest.py 同日補上）
        run: |
          pytest tests/ apps/backend/tests/ apps/game-rpg/tests/ --timeout=60 --cov=apps/backend/src --cov-report=term-missing -q
        env:
          ANGELA_HARDWARE_PROFILE: high_performance_desktop
      - name: Test isolation guard (random combination)
        run: |
          # 隨機抽 3 個測試目錄組合跑（R74）：全倉整跑會掩蓋組合間汙染
          # （R72 實例：sys.path.insert 雙重載入只在特定組合炸）；每次 CI
          # 隨機探索一種組合，汙染遲早被抓住
          DIRS=$(ls -d tests/*/ | shuf -n 3 | tr '\n' ' ')
          echo "Random combination: $DIRS"
          pytest $DIRS -q --timeout=60
        env:
          ANGELA_HARDWARE_PROFILE: high_performance_desktop
      - name: Deterministic benchmarks (L0 守成 — 20/20 + association 1.0)
        run: |
          echo "⏳ Running benchmark_ed3n_garden (deterministic, ~2s, CPU-only)..."
          timeout 30 python scripts/benchmark_ed3n_garden.py --engine both 2>&1 | tee /tmp/bench.log
          grep -q "TOTAL: 20/20" /tmp/bench.log || { echo "❌ benchmark 20/20 failed"; cat /tmp/bench.log; exit 1; }
          echo "⏳ Running validate_association (ED3N 1.0 + GARDEN 1.0, GARDEN ~8s on CPU)..."
          timeout 30 python scripts/validate_association.py --engine ed3n 2>&1 | tee /tmp/assoc.log
          grep -q "association_capability=1.0" /tmp/assoc.log || { echo "❌ association 1.0 failed (ed3n)"; cat /tmp/assoc.log; exit 1; }
          echo "✅ L0 benchmarks passed (ED3N 20/20 + association 1.0); GARDEN association validated locally (7.6s, not in CI to save time)"
        env:
          ANGELA_HARDWARE_PROFILE: laptop_power_saver
          PYTHONPATH: apps/backend/src
      - name: angela_bench native regression gate (能力基準回歸門)
        run: |
          echo "⏳ Running angela_bench native suite with regression gate (~20s)..."
          python scripts/run_benchmarks.py --backend native --suite math,knowledge,knowledge_mc,routing --gate-native --out /tmp/bench-results
          echo "✅ native capability floors met (math≥75% knowledge≥25% knowledge_mc≥90% routing≥95%)"
        env:
          ANGELA_HARDWARE_PROFILE: laptop_power_saver
          PYTHONPATH: apps/backend/src
      - name: Hold-out generalisation gate (train vs hold-out gap)
        run: |
          # 2026-10-20: the hold-out measurement existed but was never a gate
          # ("學習品質未證明" — STATUS_MATRIX 誠實缺口 #2). It also measured
          # nothing: the script read only "input"/"question"/"text" while the
          # logic corpus uses "proposition", so both sides scored 0.000 and the
          # 0.0 gap "passed" vacuously. Both are fixed; the gate now fails on a
          # wide gap AND on a vacuous measurement.
          python scripts/validate_holdout_gap.py --gate
      - name: Test count drift check
        run: |
          # 單一權威機制（scripts/check_test_count.py）：基線在腳本裡，容差為
          # 比例式（±15%），隨專案成長自動跟著走——舊版把窗口寫死在 workflow
          # 裡（7500-8400），專案成長到 8,700 後門自己變紅，與測試無關。
          python scripts/check_test_count.py --scope ci
          python scripts/check_test_count.py --measure

  map-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Project map budget gate (gen_project_map.py, stdlib only)
        run: |
          python scripts/gen_project_map.py --budget 10000
      - name: STATUS_MATRIX cross-check (YAML claims vs entities)
        run: |
          python scripts/gen_status_matrix.py check
      - name: STATUS_MATRIX view freshness (MD must match YAML)
        run: |
          python scripts/gen_status_matrix.py
          git diff --exit-code docs/STATUS_MATRIX.md
          echo "✅ Project map within 10000-line budget (over = project smell)"

  secrets_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        with:
          args: --no-git

  dashboard-e2e:
    # The dashboard panels are verified in a real browser (Chromium): the
    # API contract test proves the endpoints exist, this one proves the page
    # renders the backend's real data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: "pnpm"
      - name: Install JS workspaces
        run: pnpm install --frozen-lockfile=false
      - name: Install the dashboard's dependencies
        run: pnpm install --frozen-lockfile=false
        working-directory: apps/web-dashboard
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the backend + Playwright
        run: |
          pip install -e "./apps/backend[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Dashboard browser E2E
        run: pytest tests/frontend/test_dashboard_e2e.py -q
        env:
          ANGELA_HARDWARE_PROFILE: laptop_power_saver
