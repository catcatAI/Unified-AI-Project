schema_version: ai-compute-card-cim-freeze-draft/1
status: draft_awaiting_acceptance_check
owner: angela
drafted_by: environment_support
purpose: concrete sky130-baseline answers for the three CIM pending decisions,
  so the transistor-level design has an approvable target. Nothing here counts
  as a decision until the acceptance check passes and it is recorded in
  angela_interface_freeze_packet.yaml.
answers_draft:
  package_topology:
    principle: cheap_first_16_die_copackage
    dies_per_package: 16
    die_area_target_mm2: 1.5
    die_area_budget_mm2:
      strip_cells: 0.4
      sense_chains: 0.16
      digital_sequencer: 0.2
      pads_esd_io: 0.5
      margin: 0.2
    d2d_signal_count: 48
    d2d_signal_count_user_band: 32-64
    d2d_protocol: parallel source-synchronous DDR bus, no SerDes (sky130-friendly);
      input-word broadcast + partial-sum collect between dies
    package_exit_signal_count: 12
    package_exit_signal_count_user_band: 8-16
    package_exit_role: control + result stream to board; the package IS the
      memory<->processor compute narrow band
    package_type: wire-bond MCM (cheapest assembly); exact package quote_required
    tapeout_mode: MPW shuttle share (small die = cheap); price quote_required,
      no estimates recorded per component_registry policy
  cim_strip_array_plan:
    strip_count_current: 8
    strip_input_width_bits_current: 2048
    weight_slots_per_strip: 2048
    weight_format: int8_as_8_gate_strapped_unit_cells
    unit_cell: nfet W=0.42um L=0.15um (single spice bin, DOT4L-proven)
    cells_per_die: 131072
    cells_per_package: 2097152
    weights_per_die_kb: 16
    weights_per_package_kb: 256
    mac_per_pass_per_die: 16384
    broadcast_time_ns_at_48_lines_ddr200: 107
    per_die_rate_envelope: sensing-time-limited; 1us sense -> ~0.9M passes/s
      -> ~15 GMAC/s/die; peak broadcast limit ~40x higher (model before claim)
    package_rate_envelope_gmacs: ~235 GMAC/s int8-equivalent at 5-6 effective
      bits, upper bound pending sense-chain model
    card_scaling: 1MB weight = 4 packages (64 dies); card = 4-16 packages,
      chosen at the card_l2_selection decision
    main_compute_topology: strip_array_is_the_main_compute; a digital
      sequencer (secondary compute) addresses weights, drives input words,
      and sequences sense events
    end_state_scale_reference: 16384-bit fabric / 250MHz / 64 digital MAC
      tiles / single 16-partition die remain end_state_milestones; the
      current-process baseline is the 16-die co-package
    evidence: [DOT4.mag, DOT4L.mag, tb_dot4l results]
  die_l1_sky130_feasibility:
    activation_cache_kb_baseline: 32
    activation_cache_scope: per_die (16 dies co-packaged; package-level
      activation working set = 512KB)
    weight_residency_per_die_kb: 16
    weight_residency_per_package_kb: 256
    end_state_reassignment_ack: 32MB die L1 moves to end_state_milestones
    node_assumption: sky130 self-developed small die for L2 fixtures;
      16-die MCM co-package replaces the single-large-die assumption
    blocker_resolution: current design no longer blocked; small die area
      target 1.5mm2 is cheap on MPW and 16-die co-package supplies the
      weight capacity the old single-die figure assumed
  cim_sensing_chain:
    sense_element_v1: current-mirror comparator per strip with programmable
      reference, result latched as 6-bit thermometer code
    effective_bits_v1: 5
    adc_upgrade_path: shared SAR ADC per strip group deferred to end state
    per_strip_area_budget_mm2: 0.02
    sense_chains_per_die: 8
    calibration_plan: two-point gain calibration at 250C-free fixture level;
      per-cell offset from single-hot sweeps (DOT4L harness reused)
    unresolved: >-
      Two-point offset/gain calibration cannot remove I-V curvature. The
      measured cell deviates up to 28.5% of the current swing from a straight
      line at every drain bias, about 9x the 5-bit LSB budget, so the v1
      effective resolution is not justified by the drafted calibration plan and
      the sense chain carries no power or area budget of its own.
  measured_power_and_energy:
    derived_from: measured sky130 unit cell current, not assumed
    drafted_array_rail_v: 1.8
    unit_cell_power_mw_at_drafted_rail: 0.354
    unit_cell_power_mw_at_0p3_rail: 0.036
    rail_reduction_available_x: 9.8
    package_power_w_expected: 185.5
    card_power_w_at_4_packages: 741.8
    card_budget_w: 300
    card_budget_multiple: 2.4728
    worst_case_card_power_w: 2967.3
    energy_pj_per_mac: 707
    tops_per_w: 1.41
    finding: >-
      A single 16-die package fits the 300W board budget, but the drafted card
      is 4-16 packages, so the card is 2.5x over budget at expected activation
      density and about 10x over at worst case. At 707pJ/MAC the configuration
      is roughly 70x worse than same-process digital logic and about 6x worse
      than a published 65nm analog CIM macro at 7/4/7b, so the CIM topology as
      drafted inverts the value proposition that motivated it.
    required_before_decision:
      - lower the array rail to the feasible minimum set by the read-swing and
        sense-chain noise-floor limits, not to the minimum power point
      - state a bit-slicing plan, because published analog CIM loses about two
        orders of magnitude of energy efficiency between 1/2/1b and 7/4/7b
      - budget the sense chain power explicitly; the array figure is a lower bound
validated_current_process_design:
  status: derived_and_gate_checked_awaiting_acceptance
  derived_by: ai.hardware.cim_strip_reference.CimStripReferenceModel.recommended_design
  note: >-
    This is the answer the drafted configuration was missing: a current-process
    operating point that satisfies every gate. It replaces the drafted 1.8V rail
    and 1us sense window, which were the two numbers that made the topology look
    unviable. It is a fixture-level result for the acceptance check to pass or
    fail, not yet a decision.
  operating_point:
    array_rail_v: 0.3
    input_swing_v: 1.0
    sense_window_ns: 50
    weight_scheme: 1:2:4:8_current_weighted_single_pass
    passes_per_weight: 1
    unit_cell_current_ua: 19.7
  results:
    energy_pj_per_mac: 0.594
    best_published_reference_pj_per_mac: 0.98
    sky130_digital_baseline_pj_per_mac: 10
    card_power_w: 12.5
    board_power_budget_w: 300
    board_budget_used_frac: 0.042
    throughput_tmacs_per_package: 5.24
    throughput_tmacs_per_card: 21.0
    tops_per_w: 1.68
    noise_limited_resolution_bits: 8.36
    claimed_effective_bits_v1: 5
  gates_all_passed: true
  improvement_vs_drafted:
    energy_pj_per_mac: 1190
    card_power_w: 59.5
  why_the_draft_failed:
    - >-
      array rail 1.8V: array power is Icell*Vds, so the rail is the dominant
      lever; 1.8V to 0.3V cuts cell power about 9.8x
    - >-
      input swing 1.8V: cell current is set by the gate, so the swing sets the
      current; 1.8V to 1.0V cuts it about 10x
    - >-
      sense window 1us with no stated basis: energy per MAC is dominated by this
      term, and 1us to 50ns is a 20x reduction on its own
    - >-
      the die was under-filled 7.27x against its own strip area budget, which
      is a weight-capacity problem, not an energy one
  sensitivity:
    sense_window_is_linear_and_binding: >-
      energy per MAC is linear in the sense window; the energy gate fails at
      82.4ns, so the 50ns choice carries 1.65x headroom
    sense_chain_power_is_not_load_bearing: >-
      the assumed 90uW comparator power can be wrong by 200x before a gate
      fails, so it does not need measuring first
    input_gate_capacitance_is_not_load_bearing: >-
      even 10fF per input gate moves total energy by under 1%
    remaining_unverified:
      - a real sense chain meeting 50ns in this process
      - die-level layout of a 0.3V rail with a 0.3V read swing
  explicit_non_claims:
    - no timing closure and no 250MHz claim
    - no fabrication readiness
    - no die or package has been laid out or measured
    - energy figures are a fixture-level model, not silicon
  correction_to_bit_slicing: >-
    An earlier pass in this work recommended analog bit-slicing because a binary
    weight bit looks cheaper per conducting cell. That comparison was wrong: a
    binary pass resolves one weight bit, so int8 needs weight_bits passes, and
    once charged for all of them the 1:2:4:8 single-pass scheme is about 2x
    better. The model now normalises both to a completed weight product, and a
    test guards the normalisation.
validation_gates_before_decision:
  strip_fixture_drc_clean:
    status: satisfied_by_measurement
    evidence: >-
      the generated strip fixture, ai.hardware.cim_weight_strip.build_strip and
      its 2-copy tile: magic "drc list count total" over the whole cell = 0 and
      KLayout sky130A_mr.drc (feol + beol + offgrid) = 0 items, both measured
      2026-09-29
    how_this_was_false_before: >-
      this gate used to read "chip workspace strip fixture, magic DRC 0
      errors". The reader ran without selecting the top cell, so the magic box
      was degenerate and drc listall why returned nothing for any layout, and
      the strip itself was then missing locali/metal1 enclosure, poly extension
      and n-well island clearance. Both the reader and the layout were fixed
      before the number above was taken
    reference_layout_is_not_drc_clean: >-
      the chip workspace file the DOT4L weight figures below came from,
      DOT4L.mag, is a different layout: 217 magic errors, 122 KLayout errors,
      measured 2026-09-29. Its ngspice numbers are simulations of an extracted
      netlist, which is not a DRC claim
  weight_linearity_within_1_lsb_at_5_bits:
    status: satisfied_by_measurement
    evidence: >-
      DOT4L single-hot response 1:2.0000:4.0000:8.0000, max relative error
      5.1e-7, KCL sum error 3.4e-8; reproducible via
      EdaAgent.verify_cim_weight_response
  weight_response_at_reduced_operating_point:
    status: satisfied_by_measurement
    operating_point: 0.3V array rail, 1.0V input swing
    evidence: >-
      the same ngspice cross-check re-run at the recommended design point:
      ratios 1 : 2.0000 : 4.0000 : 7.9999979, max relative error 2.5e-7, KCL
      sum error 1.4e-7, idle 4.6pA against 19.7uA per unit cell; reproducible
      via EdaAgent.verify_cim_weight_response -> reduced_rail_cross_check
    what_this_does_not_show: >-
      identical parallel cells add by construction in SPICE, so this shows the
      cell still conducts a usable, ratio-preserving current at the reduced
      point; it does not cover mismatch, corners or the sense chain
  card_level_array_power_within_300w:
    status: not_satisfied_at_drafted_configuration
    evidence: >-
      a 4-package card draws 741.8W at the drafted 1.8V rail, and 2967.3W at
      worst-case activation density
    satisfied_by_validated_design: true
    satisfied_by_validated_design_evidence: 12.5W at a 0.3V rail, 4.2% of budget
  cim_energy_competitive_with_digital:
    status: not_satisfied_at_drafted_configuration
    evidence: 707pJ/MAC against a 10pJ/MAC same-process digital baseline
    satisfied_by_validated_design: true
    satisfied_by_validated_design_evidence: 0.594pJ/MAC, below the 0.98pJ/MAC
      best published analog CIM reference
  sense_comparator_golden_vectors:
    status: not_started
    evidence: >-
      blocked on a real sense chain; the validated design assumes a 50ns window
      that no extracted layout has yet demonstrated
  remaining_unverified:
    status: blocking_decision
    items:
      - a real sense chain meeting 50ns in sky130
      - die layout of a 0.3V rail with a 0.3V read swing
what_stays_untouched:
  - all six original pending decisions and known_initial_conditions
  - interface contracts, budgets, terminology guard
  - end-state_milestones remain end-state; they must not constrain this design
single_die_status:
  status: array_designed_drc_clean_extracted_and_simulated
  objective: the whole chip as ONE die, not a co-package
  supersedes_for_this_objective: the 16-die wire-bond MCM co-package tiering
  what_is_now_proven:
    - >-
      the strip array is not a paper design: a generated 2-copy tile passes
      magic DRC with 0 errors (KLayout sky130A_mr.drc reports 0 items on the
      same GDS), extracts 30 real nfets at W=0.42um L=0.15um, and wires them
      into 4 drain spines per strip sized 8/4/2/1 cells, 8 spines across the
      tile, and 1 common ground
    - >-
      the extracted netlist, simulated, holds the intended weight ratio: the
      1:2:4:8 spine currents come back at worst 0.0001 percent error from
      cim_verify.simulate_spine on the stripped netlist, and the bundled DOT4L
      single-hot fixture reproduces 1:2.0000:4.0000:8.0000 to 5.1e-7 relative
    - >-
      the architecture computes real int8 products: 6 matrix-vector cases
      through 15605 simulated cells return the exact integer dot products
      (19, 255, 0, 200 hand-checked) with worst relative error 2.8e-7
  superseded_claims:
    - claim: >-
        "extracts 32 real nfets ... 8 drain spines of 4 cells, 4 input lines of
        8 cells" and "worst relative error 6.2e-8 over 6 patterns x 8 spines"
      reason: >-
        both came from cim_cell_layout, a 32-cell fixture deleted because its
        geometry predated the cell spec. No code in this repository produces
        either figure any more. The measurements above are what
        EdaAgent.run_cim_single_die_experiment and cim_verify.simulate_spine
        return on 2026-09-29
  reproducible_by:
    - EdaAgent.run_cim_single_die_experiment
    - EdaAgent.run_cim_dot_product_experiment
    - EdaAgent.verify_cim_weight_response
    - ai.hardware.cim_primitives.Canvas
    - ai.hardware.cim_weight_strip.build_strip
    - ai.hardware.cim_verify.simulate_spine
  area_findings_that_change_the_plan:
    measured_cell_density_um2: 9.1733
    measured_on: >-
      the generated 2-copy tile of build_strip: 20.0 x 13.76 um bounding box
      over 30 extracted nfets, magic DRC 0 errors, measured 2026-09-29
    packet_claimed_cell_density_um2: 0.42
    ratio: 21.8
    why: >-
      the packet figure is the bare device W*L with no contacts, no spacing and
      no routing; the measured figure is a tile magic has actually DRC-checked.
      The earlier 10.20 um^2 figure is not used here: it came from cim_cell_layout,
      a 32-cell fixture this repository deleted, and was never a property of the
      topology
    weight_capacity_kb_per_die_at_measured_density:
      die_1p5mm2: 12.97
      die_4mm2: 34.6
      die_9mm2: 77.85
      die_25mm2: 216.24
      die_100mm2: 864.96
    requirement_area_mm2_at_measured_density:
      weights_1mb: 76.95
      weights_16mb: 1231.22
    single_die_verdict: >-
      A 1 MB int8 weight capacity needs about 77 mm2 of array at the measured
      density, so it is not a single chip at any plausible die size, and the
      16 MB working set is still orders of magnitude out. The packet's claim
      that 1 MB is about 3.6 mm2 came from counting device area only.
  pdk_constraint_found:
    min_characterised_nfet_width_um: 1.255
    drafted_cell_width_um: 0.42
    consequence: >-
      sky130 characterises nfet_01v8 only down to W=1.255um / L=145nm, so the
      drafted 0.42um cell has no characterised model and cannot be simulated
      against real PDK corners. A design that wants corner-accurate numbers must
      use a finger width the PDK covers, which costs roughly 3x the cell area
      again.
  still_open:
    - >-
      weight programmability: the verified tile is geometry-fused, so every
      weight bit is all-ones. A selectable cell (the 2T select+weight option the
      chip workspace already flagged) is a separate design and is not covered by
      any result above
    - sense chain, digital sequencer, pad ring and power grid are not laid out
    - >-
      the array_fraction used for the capacity table is an assumption; the
      non-array blocks have not been placed, so the real per-die capacity is
      lower
    - no timing closure, no corner sweep, no fabrication claim
  explicit_non_claims:
    - the 16 MB working set is not reachable on one die at the current process
    - no L1/L2/L3 memory hierarchy has been designed for this die
    - nothing here is a fabrication-ready deliverable
