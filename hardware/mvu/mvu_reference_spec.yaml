schema_version: mvu-reference-spec/1
status: superseded_reference_only
superseded_by: ../ai_compute_card/ai_compute_card_task.yaml
hardware_execution: false
physical_device_required: false
validation_environment:
  mode: software_only
  install_new_tools: false
  existing_tools: [python, pytest, ngspice, klayout, magic, kicad-cli]
  professional_hdl_simulation: deferred
  physical_hardware: false
  evidence_rule: software_reference_results_are_not_gate_level_or_timing_signoff
modules:
  sram_32kb_dualport:
    banks: 16
    bytes_per_bank: 2048
    port_a:
      address_bits: 4
      output_bits: 16384
    port_b:
      address_bits: 4
      word_select_bits: 5
      delta_bits: 32
      bit_mask_bits: 32
  pe_array_16x16:
    mac_type: signed_int8
    rows: 16
    columns: 16
    activation_input_bits: 1024
    weight_input_bits: 16384
    c_gap_output_bits: 512
    logits_output_bits: 256
  plasticity_engine:
    c_gap_input_bits: 512
    delta_output_bits: 32
    hit_mask_output_bits: 32
    word_select_output_bits: 5
    ratio: 0.0588
  wavefront_controller:
    banks: 16
    read_pointer: count
    write_pointer: (count - 1) modulo 16
    phase_sync_count: 15
  test_harness_axi:
    protocol: AXI4-Lite
    address_bits: 32
    data_bits: 32
    cr_address: 0x00
    sr_address: 0x04
    indirect_sram_address: 0x20
    indirect_sram_data: 0x24
    direct_sram_window: [0x1000, 0x8FFF]
reference_assumptions:
  weight_encoding: signed_int8_q0
  weight_max: 127
  delta_encoding: packed_signed_int8x4
  port_b_word_window: first_32_words_per_bank
  c_gap_definition: logit_minus_target
  target: 0
  pe_mapping: one_16_byte_row_from_each_bank
  pe_activation_slice: first_16_values_per_token
evidence_levels:
  L0: specification_only
  L1: python_reference_and_pytest
  L2: existing_eda_simulation_or_drc
  L3: hdl_gate_level_simulation
  L4: synthesis_and_static_timing
acceptance:
  rounds: 2
  pipeline_stalls_max: 0
  pipeline_stalls_measurement: not_modeled_without_AXI_FIFO_ready_valid
  raw_bank_collisions_max: 0
  modified_bit_ratio_min_exclusive: 0
  modified_bit_ratio_max: 0.03125
  logit_diff_sign: opposite_c_gap
blocking_questions:
  - id: port_b_word_select_width
    issue: 5-bit select reaches 32 words but a 2 KB bank contains 256 64-bit words
    options: [use_8_bit_select, define_32_word_window_and_base_register]
  - id: axi_sram_window
    issue: registers 0x10..0x1C cannot map 32 KB directly
    options: [indirect_address_data_window, direct_0x1000_window]
  - id: fixed_point_contract
    issue: W_max and Q-format are not specified
    options: [signed_int8_q0, declare_explicit_fixed_point]
  - id: convergence_sign
    issue: C_Gap sign convention is not specified
    options: [logit_minus_target, target_minus_logit]
next_implementation_stage:
  - software_reference_tests
  - digital_netlist_or_hdl_generation
  - waveform_and_bit_diff_comparator
  - generic_synthesis_and_static_checks
  - human_review_before_fpga_or_asic_claim
