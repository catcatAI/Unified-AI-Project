host_proxy_simulation:
  kind: host_proxy_not_l1
  date: 2026-10-07
  rerun_2026_10_08:
    status: contaminated_do_not_compare
    evidence: >-
      three same-day reruns while the box ran concurrent experiments (load average up
      to 5.19): the host bandwidth anchor fell 18.0 -> 16.9 -> 12.8 GB/s and prefill
      fell 905.2 -> 54.4 -> 16.8 tok/s (decode 13.19 -> 12.85 -> 4.76) while every
      hard gate still passed; the idle-machine physics still check out (3.35 GB /
      18.0 GB/s = 0.186 s ~= 866 tok/s for 161 tokens, consistent with the recorded
      905.2), so the drift is contention, not a bad recording
    decision: keep the 2026-10-07 idle-run numbers below; re-run on an idle box to refresh
  rerun: .venv/bin/python scripts/sim_edge_card_software.py --json out.json
  source: scripts/sim_edge_card_software.py
  host: Intel-i5-12400F-6P-cores / llama-cpp-python-0.3.35 / n_threads=6 / single-threaded DRAM anchor only
  model: google/gemma-4-E2B-it QAT Q4_0 GGUF (local snapshot, 3.350 GB)
  measured:
    gguf_file_gb: 3.35
    decode_tok_s: 13.19
    prefill_tok_s: 905.2
    prefill_prompt_tokens: 161
    host_read_gbs_single_thread: 18.0
    host_stream_demand_implied_gbs: 44.2 # decode tok/s x full file (upper-bound traffic model)
  projections:
    envelope_gb: 5.85
    decode_file_stream_bound_tok_s: [16.8, 19.9]
    eta_needed_for_target: 0.491
    load_from_host_s: 1.7
  verdicts:
    envelope_vs_8gb_floor: PASS
    decode_bound_vs_target_15: PASS
    load_vs_target_5s: PASS
  caveats:
    - x86 CPU proxy only; L1 targets still require an Orin NX devkit
    - host decode 13.19 tok/s exceeds what full-file streaming allows at the host's
      single-thread-class bandwidth, so the active-text-weights model (~2.4 GB,
      excludes vision/audio towers) is the better anchor; the full-file bound
      [16.8, 19.9] is kept as the conservative floor
    - prefill 905 tok/s is host-specific and NOT projected; the card's prefill
      budget stays the Orin INT8 analytic bound (>= 800 tok/s target)
    - "decode_bound_vs_target_15: PASS is a BANDWIDTH-only verdict; the structural
      cycle simulation (cycle_simulation, 2026-10-07) shows the card is
      compute-bound at 15 GMAC/s (GPU-only dense30, 3.56 tok/s), so this PASS
      does not carry to decode reality - see cycle_simulation.refutes"
cycle_simulation:
  kind: structural_discrete_event_not_l1
  date: 2026-10-07
  verified:
    date: 2026-10-08
    result: >-
      zero drift from a fresh rerun of cycle (3.56 tok/s, 12588 hops, per-token
      281.19-281.26 ms, replay identical), long-run (50373 hops, 0 violations)
      and the full sweep (15 real-module points, 4 probes, load paths
      1.70/2.09/1.40 s, baseline cross-check OK); real_mode_util_range was
      corrected this date from the subset minimum 0.041 to the full-sweep 0.029
      (nx16_15W @131072) - every other diagram-backed number reproduced as recorded
  rerun: .venv/bin/python scripts/sim_edge_card_cycle.py --json out.json
  source: scripts/sim_edge_card_cycle.py
  engine: apps/backend/src/ai/hardware/edge_card_sim.py
  design_drawing: design_drawings.decode_datapath
  model: google/gemma-4-E2B-it QAT Q4_0 GGUF (local snapshot, 3.350 GB, 541 tensors)
  method:
    - "card executed, not extrapolated: LPDDR5 / INT8 MAC / SRAM queue / PCIe Gen4 x1
      are discrete-event servers at the spec's bit widths and clocks"
    - compute = GPU Tensor Cores only (dense30 @25W, MAC=2 confirmed); the
      module-topline DLA share (20/40 dense) is excluded - CNN-only silicon
      that cannot run a transformer decoder (compute.module, src_dla_layers)
    - one decode step cut into 591 items straight from the GGUF tensor table
      (exact bytes from tensor offsets, MACs from tensor dims, KV int8 @32K,
      tied lm_head streams full token_embd, layers 0-14 own KV -> 15 writes)
    - hop-by-hop engine checks every hop against physical ceilings, SRAM bounds,
      dependency ordering, and progress (dt==0 no-progress watchdog)
    - a run counts only if checkpoints replay bit-identically (digest) AND the
      workload totals are consumed EXACTLY at each token boundary
  checkpoints_hops: [16, 100, 1000, 10000] # all PASS: 0 violations, replay equal
  gate:
    min_tok_s: 3.3 # regression floor: measured 3.56; fails loud if the engine drifts
  measured: # GPU-only dense30 @25W, MAC=2 -> 15 MAC/ns (DLA excluded)
    tokens: 5
    hops: 12588
    decode_tok_s: 3.56
    per_token_ms: 281.19
    utilization: { mac_array: 1.000, mem_service: 0.067, pcie: 0.000 }
    bottleneck: mac_array # COMPUTE-BOUND
    ops_per_token: { total: 4.218e+9, weights: 2.280e+9, attention: 1.938e+9 }
    bytes_per_token: { reads: 1.649e+9, writes: 9216, pcie: 8 }
    violations: 0
    replay_identical: true
    workload_exact: true
  long_run: # extended validation: no drift over 50k hops / 20 tokens
    run: ".venv/bin/python scripts/sim_edge_card_cycle.py --checkpoints 16,100,1000,10000,50000 --tokens 20"
    hops: 50373
    tokens: 20
    checkpoints: [16, 100, 1000, 10000, 50000] # all replay bit-identical, 0 violations
    violations: 0
    replay_equal_all_checkpoints: true
    workload_exact: true # integer retire counters - exact by construction (was
    # float accumulation, found drifting at ~52k hops by this very run, then fixed)
    per_token_ms_range: [281.19, 281.26] # slight creep = KV growth on full-attn layers
  sensitivity:
    tops_convention_resolved: mac_2 # TOPS = 2 ops/MAC: INT8 dense = exactly 2x FP16 dense on the same Tensor Cores (38 vs 19, src_jetson_orin_page)
    c1_reading_retired_tok_s: 7.11 # 1-op reading of GPU dense30 - invalid; pre-correction 11.85/18.45 also wrongly counted DLA TOPS
    needed_gmac_s_for_15_at_32k: 63.3
    gpu_dense_gmac_s: { w25: 15, w40_maxn_super: 19 } # decode-usable compute
    weights_only_floor_gmac_s: 34.2 # ctx->0 floor = 68 dense TOPS @2ops/MAC
    conclusion: >-
      15 tok/s is unreachable on this silicon at ANY context under the
      confirmed convention: it needs 63.3 GMAC/s at 32K and 34.2 GMAC/s
      even at ctx->0, while the GPU (the only decode-usable compute) gives
      15 GMAC/s @25W and 19 GMAC/s @MAXN_SUPER. The module-topline readings
      (50/78 dense) counted the 2x NVDLA share (20/40 dense) that cannot
      run a transformer decoder (src_dla_layers). Sparse 2:4 would double
      the GPU (30/38.5 GMAC/s) but still misses 63.3 at 32K, needs a
      2:4-pruned checkpoint + TRT-LLM path that does not exist for Gemma 4
      QAT (unverified, L1 item), and MTP/speculative decoding does not help
      a compute-bound decode (MACs scale with emitted tokens - only weight
      BYTES amortize, which would matter only on a bandwidth-bound card).
  balance_study: # module-carrier balance sweep (2026-10-07): SKU x TOPS reading x ctx
    source: scripts/sim_edge_card_sweep.py
    rerun: ".venv/bin/python scripts/sim_edge_card_sweep.py --json out.json"
    context: >-
      the card is a Jetson Orin NX module carrier: compute, LPDDR5 and the
      PCIe endpoint live in the purchased module, so the balance knobs are
      module SKU, nvpmodel power mode and context length. The TOPS counting
      convention is no longer a knob: MAC=2 is fact-confirmed and decode
      uses GPU-only dense TOPS with the DLA share excluded (compute.module).
      Every point is the structural engine's measured steady rate (2 tokens
      per point, cross-checked against the cycle runner's baseline within 2%).
    ctx_order: [8192, 16384, 32768]
    real_modes_tok_s: # {mode: [8K, 16K, 32K]} - GPU-only dense, MAC=2
      nx8_25w_c2: [4.45, 3.81, 2.96] # 8GB SKU GPU dense25@25W (765MHz)
      nx16_25w_c2: [5.34, 4.58, 3.56] # 16GB GPU dense30@25W = spec baseline
      nx16_15w_c2: [3.74, 3.20, 2.49] # derived GPU dense21 (25W x 0.7)
      nx16_40w_c2: [6.77, 5.80, 4.50] # MAXN-SUPER GPU dense38
    meets_target:
      any_mode_any_ctx: [] # under confirmed MAC=2 + GPU-only, nothing reaches 15
      best_point: "nx16_40w_c2 @8K = 6.77 tok/s (44% of target)"
    memory:
      max_real_mode_ops_ns: 19 # biggest purchasable GPU MAC rate (MAXN 38 dense / 2)
      bind_point_ops_ns_32k: 222.6 # analytic: 87.04 B/ns x 2.558 ops/B (Q4)
      roofline_tok_s_at_32k: 52.8 # a ~223 ops/ns class module saturates LPDDR5
      real_mode_util_range: [0.029, 0.114] # nx16_15W@131K .. 40W@8K full sweep, never an eighth
      probes_mem_util_at_32k: { r100: 0.447, r150: 0.644, r222_6: 0.770, r445_2: 0.929 }
      conclusion: >-
        idle LPDDR5 is structural, not a tuning miss: Q4 arithmetic intensity
        (2.558 ops/byte) means memory saturates only above ~223 ops/ns
        (~445 TOPS-class) while the biggest GPU MAC rate purchasable is 19 -
        the 445.2 probe already shows the trade (mem 92.9%, mac falls to
        46.5%, tok/s 49.0 converging on the 52.8 roofline asymptote). And
        the idle bandwidth cannot be spent anyway: no purchasable mode
        supplies the compute the target needs (sensitivity), so the headroom
        stays headroom.
    pcie:
      decode_util_at_15_tok_s: 6.1e-08 # 8 B/token: a token stream by design
      load_s_at_payload: 1.70 # 3.35 GB / 1.969 GB/s Gen4 x1
      load_s_at_achievable_1_6: 2.09 # spec achievable floor, >=85% TLP efficiency
      load_budget_s: 5
      load_verdict: PASS # this is where x1 IS utilized (~100% / 85% duty)
      role: load + hot-reload + token/control stream; decode never needs more
    recommendation:
      gate: "human product decision: the technical branch is closed by facts"
      fact_resolved: "MAC=2 + GPU-only dense confirmed (src_jetson_orin_page, src_dla_layers); no SKU x power x ctx combination reaches 15 dense"
      option_a: "accept the honest rates: 3.56 (25W @32K) .. 6.77 (40W @8K); cooling unlock remains the only lever (+26% at 32K)"
      option_b: "revisit target/model/silicon - smaller model, different module class, or discovery of a 2:4-sparse checkpoint + TRT-LLM path (none exists for Gemma 4 QAT); product decision, human-gated"
      option_c: "8GB SKU cost-down: 2.96..4.45 tok/s (same GPU at 765MHz), never meets 15; capacity tier only"
      anti_goal: "chasing memory utilization (>223 ops/ns) or reviving the retired 1-op reading - both refuted"
    cost_frame: >-
      no prices anywhere (quote required by policy): option A = 0 BOM delta
      (devkit time only), option B = same module + cooling/power-path rework
      inside the slot's combined 75W limit, option C = cheaper SKU with the
      weaker numbers above. Every option keeps the Gen4 x1 edge and the Orin NX family.
    status: candidate_pending_l1_benchmark_and_l2_thermal
  refutes:
    - claim: >-
        performance_budget.decode_tok_s.derived_e2b_q4_0_range [23.5, 27.7] tok/s
        (and the [16.8, 19.9] file-stream range) as a decode forecast
      why: >-
        those are pure-bandwidth derivations assuming free compute; the structural
        sim measures mac_array at 100% while memory sits at 7%, so the bandwidth
        bound does not bind. The arithmetic stays in performance_budget (verified
        by tests/unit/test_edge_card_spec.py) but decode reality is compute-bound:
        the GPU provides 15 GMAC/s @25W (19 @MAXN_SUPER) against the 63.3
        GMAC/s the target needs at 32K.
  caveats:
    - L0 structural simulation of THIS spec's configuration, not L1 silicon measurement
    - "TOPS convention resolved by fact (MAC=2, GPU-only dense,
      src_jetson_orin_page): the retired 1-op reading and the DLA-inclusive
      module topline both overstate decode compute"
    - conservative starve accounting pauses compute when staged bytes run out;
      at measured mac util 1.000 the pauses did not bind on the bottleneck
    - prefill not simulated here; prefill budget remains the analytic bound
      in performance_budget.prefill_tok_s
explicit_non_claims:
  - no measured performance numbers on the target hardware yet (host-proxy simulation
    numbers exist above and are labelled as such); card decode/prefill figures remain
    budgets with stated assumptions until L1 on an Orin NX devkit
  - no prices anywhere in this file (quote required by policy)
  - no physical board, no fabrication, no component order placed by this file
  - no answer or freeze of any angela_interface_freeze_packet pending_decision
  - endpoint Gen4 x1 training is designed-for, not yet demonstrated
