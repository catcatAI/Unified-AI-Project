      問句時回舊事實，陳述句不再被舊事實蓋掉；新增 `MemoryIntegration
      .try_conversation_recall` 讓「我剛才說我叫什麼名字？」→「你叫小明。」）、
      **不再用罐頭句蓋掉情緒**（reflex 預設的子字串比對改成「整句就是那句問候」
      才觸發，「我今天很累」不再拿到「今天是个好日子！」；情緒偵測的正則 `\b`
      前綴讓中文分支永遠不匹配，已修；疲累模板補上「累」等關鍵字）、
      **不再碎念**（NeuroBlender 原本每個 role 各取 2 個片段、最多 6 句，現在
      每 role 1 個、總數上限 3 句）。**量測設計也改了**：同一個問題問兩次
      （教之前 → 教之後），「學習效應」＝兩次的分數差＝**+0.600**——也就是
      「多少交談資料才學會」的答案：**教一輪就學會**（教之前誠實說不知道，
      教之後答得出「你叫小明。」）。
      **預算門禁可中斷**（每回合前查預算，超了乾淨收束並輸出 partial），
      門檻在 `scripts/native_dialogue_budget.txt`；這是**臨時門禁**，拆除理由
      寫在 `scripts/open_gates.json`，由 `scripts/check_open_gates.py` 驗證——
      沒有正當、可驗證的拆除理由者不得入簿（模糊字眼／缺欄位／檔案不存在／
      沒接 CI 一律拒收），事實門另立 `gates.open_gates_wellformed` 與
      `gates.open_gates_count`（後者記 INFO，讓它不會被忘記）。
      另修：提交的設定必須等於預設——`*.user.yaml`（執行期狀態）已移出版本控制
      並進 .gitignore，門禁 `scripts/check_default_config.py` +
      事實 `config.committed_config_is_default` 守著。
      **人話標準與標準集（2026-10-21）**：新增
      `apps/backend/src/ai/response/human_speech.py`——可裁決的「人話標準」（六條
      規則：回答了問題／斷言正確或已標示條件／**有邊界條件時要指出例外**／內容
      有根據／不是回聲／不是亂碼）與 **≥1000 題的標準集**（`state` 帶邊界條件的題
      324 題、`multi` 多重事實 72 回合、`qa` 492 題、`dialogue` 166 回合——對話實例
      也在裡面）。實測（純本地基模、標準集 1036 回合）：**人話標準通過率 61.0%**
      ——逐類：問答 95%、斷言題 88%、對話 75%、多重事實 65%、**帶邊界條件的題 0%
      （0/324 全滅）**、QA 機器 13%、學習效應 +0.373。結論誠實：**純本地基模目前
      還不能算「會說人話」**——帶邊界/例外的題一題都答不來（多數是誠實棄權），
      多重事實也會記錯。門禁把「人話標準通過
      率」「標準集題數（必須 ≥1000）」「帶邊界條件題的通過率」一起納入裁決。
      **推理層補上一級**：`ai/reasoning/claims.py` ＋
      `configs/standard/reasoning/claims.yaml`——**斷言推理**（「X 這句話對嗎？」
      要帶條件與例外＝「最正確」那一級，斷言庫是知識資產、庫外誠實棄權；知識庫
      不得回答斷言題，原本會回「答案是 100。」這種假答案）；**多重事實組合**
      （回憶層會把問題拆成子句並一次回答多個事實）。標準集新增 `claim` 類 48 題
      （斷言庫覆蓋的題＝量機制），與 `state` 類 324 題（刻意不重疊＝量知識缺口）
      分開，避免自己教自己。
    last_verified: "2026-10-21"

