#
# 五級狀態：claimed → implemented → wired → verified → production
#   claimed     宣稱存在（無驗證）
#   implemented 程式存在（主要方法已實作）
#   wired       生產路徑呼叫
#   verified    端到端測試證明（附 verify_command）
#   production  benchmark 達標
#
# 核對規則（gen_project_map.py 交叉驗證，違反即 CI 紅）：
#   - implementation 檔案必須存在
#   - tests 檔案必須存在
#   - status ∈ {verified, production} ⇔ verify_command 必須存在（反之亦然）

