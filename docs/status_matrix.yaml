# -----------------------------------------------------------------------------
# Chat Pipeline（主對話管線的階段構成；路徑由工具核對存在性與被引用）
# -----------------------------------------------------------------------------
chat_pipeline:
  description: >-
    WebSocket 訊息進入後的主處理序。各階段對應真實模組；
    本區段由 gen_status_matrix check 核對路徑存在＋imported_by 非空。
  entry: apps/backend/src/api/routes/chat_routes.py
  stages:
    - id: classify
      name: 意圖／複雜度分類
      modules: [apps/backend/src/ai/core/query_classifier.py]
    - id: emotion
      name: 情緒分析與閾值調整
      modules: [apps/backend/src/services/llm/emotion_analyzer.py]
    - id: crisis
      name: 危機偵測閘門
      modules: [apps/backend/src/ai/crisis/crisis_system.py]
    - id: alignment
      name: Level5ASI 對齊檢查
      modules: [apps/backend/src/ai/level5_asi_system.py]
    - id: intent
      name: 意圖註冊與路由
      modules: [apps/backend/src/core/intent_registry.py]
    - id: gate
      name: 執行權限閘門
      modules: [apps/backend/src/ai/core/execution_gate.py]
    - id: route
      name: 文檔/任務意圖路由
      modules: [apps/backend/src/services/document_router.py]
    - id: model
      name: 模型匯流排（多 provider 呼叫）
      modules: [apps/backend/src/ai/core/model_bus.py]
    - id: causal
      name: 因果預測注入
      modules: [apps/backend/src/ai/reasoning/causal_reasoning_engine.py]
    - id: memory
      name: 記憶查詢與更新
      modules:
        - apps/backend/src/ai/memory/ham_memory/ham_manager.py
        - apps/backend/src/ai/memory/domain_ripple.py

# -----------------------------------------------------------------------------
# Feature Tree（產品能力樹；語意事實，工具只核對節點引用的模組存在）
# -----------------------------------------------------------------------------
feature_tree:
  - id: conversation
    name: 對話
    children: [conversation-core, conversation-emotion, conversation-memory, conversation-msba]
  - id: conversation-core
    name: 核心對話（多 provider LLM＋原生引擎 fallback）
    modules:
      - apps/backend/src/services/llm/router.py
      - apps/backend/src/services/llm/providers
      - apps/backend/src/services/llm/providers/unified.py
      - apps/backend/src/ai/core/model_bus.py
  - id: conversation-emotion
    name: 情緒與危機（辨識/狀態/閘門）
    modules:
      - apps/backend/src/services/llm/emotion_analyzer.py
      - apps/backend/src/ai/alignment/emotion_system.py
      - apps/backend/src/ai/crisis/crisis_system.py
  - id: conversation-memory
    name: 記憶（HAM/向量/跨 session）
    modules: [apps/backend/src/ai/memory/ham_memory]
  - id: conversation-msba
    name: MSBA 語意區塊（7 層管線＋NeuroBlender）
    modules:
      - apps/backend/src/ai/msba/pipeline.py
      - apps/backend/src/ai/msba/neuroblender_bridge.py
  - id: agents
    name: 專業 Agent（11 specialized）
    modules: [apps/backend/src/ai/agents, apps/backend/src/ai/agents/specialized]
  - id: multimodal
    name: 多模態（視覺/音訊/生成）
    modules: [apps/backend/src/ai/multimodal]
  - id: embodied
    name: 具身化（桌面/Live2D/生命週期）
    modules:
      - apps/desktop-app
      - apps/backend/src/core/life
  - id: game-agent
    name: Luanti 遊戲代理
    modules:
      - apps/backend/src/ai/autonomous/angela_agent.py
      - apps/backend/src/ai/multimodal/game_agent.py
      - apps/backend/src/integrations/luanti_connector.py
  - id: integrations
    name: 外部整合（Drive/OS 橋）
    modules:
      - apps/backend/src/integrations/google_drive_service.py
      - apps/backend/src/integrations/os_bridge_adapter.py
  - id: offline
    name: 離線原生（ED3N/GARDEN/確定性）
    modules:
      - apps/backend/src/ai/ed3n
      - apps/backend/src/ai/garden
      - apps/backend/src/services/math_verifier.py

