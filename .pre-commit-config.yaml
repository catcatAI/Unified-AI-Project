default_language_version:
  # python3 = whatever Python 3 the host has (repo supports 3.10+; CI runs
  # 3.11/3.14). Pinning a minor (e.g. python3.10) breaks any machine that
  # doesn't happen to have exactly that interpreter installed.
  python: python3

repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: ["--line-length=100"]

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=100"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--max-complexity=10"]
        # Keep the hook identical to the CI contract (`.github/workflows/ci.yml`
        # runs `flake8 apps/backend/src tests/` with flake8 core only):
        # - no bugbear/comprehensions/simplify plugins — CI does not run them,
        #   so hook-only findings would be a false red the CI never sees;
        # - `files` mirrors the two CI scopes (everything else — scripts/,
        #   apps/backend/tests, apps/game-rpg, .angela — is out of CI scope).
        files: ^(apps/backend/src/|tests/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        # Runtime-owned file (json.dump): rewriting it fights the generator
        # and re-dirties the tree on every test run (same rationale as
        # .prettierignore's "執行期變異資料檔" entry).
        exclude: ^apps/backend/src/ai/ed3n/config/classifier_training\.json$
      - id: end-of-file-fixer
        exclude: ^apps/backend/src/ai/ed3n/config/classifier_training\.json$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-toml

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Mirror the CI contract exactly (`bandit -r apps/backend/src -ll
        # -c pyproject.toml`): medium+ severity only, backend src only.
        # Scanning the whole repo here would flag scripts/demos the CI
        # deliberately does not gate on.
        args: ["-ll", "-c", "pyproject.toml"]
        files: ^apps/backend/src/
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # No extra args: v8.30's hook entry is `gitleaks git --pre-commit
        # --redact --staged --verbose`. The old `--no-git` arg belonged to the
        # v7-era `protect` entry and is rejected as a flag error by v8.30.
        # Full-tree secret scanning (CI equivalent) is done via
        # `gitleaks detect --no-git` + .gitleaksignore in CI.

  - repo: local
    hooks:
      - id: prettier
        # Repo's own prettier (via pnpm) instead of mirrors-prettier, whose
        # mirror stopped at v3.1.0 while the repo runs 3.9.x — two prettier
        # versions fight each other (hook writes, CI --check rejects).
        name: prettier via pnpm
        entry: pnpm
        args: [exec, prettier, --write]
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
      - id: eslint
        name: eslint via pnpm
        entry: pnpm
        args: ["lint:js"]
        language: system
        pass_filenames: false

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
