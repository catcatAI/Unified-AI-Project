packages:
  - 'packages/*'
  - 'apps/*'
  - 'apps/*/electron_app'

overrides:
  "@eslint/eslintrc>minimatch": "3.1.4"
  "@humanwhocodes/config-array>minimatch": "3.1.4"
  "flat-cache>flatted": "3.4.2"
  "axios>form-data": "4.0.6"
  "brace-expansion@1": "1.1.18"
  "brace-expansion@2": "2.1.4"
  "brace-expansion@5": "5.0.9"
  "js-yaml@4": "4.3.1"
  "nanoid@3": "3.3.18"
  "postcss": "8.5.23"
  "sharp": "0.35.0"
  "tar@7": "7.5.22"
  "undici@6": "6.28.0"
  "undici@7": "7.29.0"

allowBuilds:
  electron: true
  electron-winstaller: true
  sharp: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - electron
  - es5-ext
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
